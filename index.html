  <style>
:root {
  --bg: #e8eef3;
  --surface: #ffffff;
  --surface-2: #f4f7fa;
  --text: #14202b;
  --muted: #5c6b78;
  --line: rgba(20, 32, 43, 0.09);
  --accent: #0c6d7c;
  --accent-hover: #0a5c69;
  --accent-soft: #e3f2f4;
  --danger: #c62828;
  --danger-soft: #fdecec;
  --money: #0a7a4a;
  --ok: #0a7a4a;
  --shadow: 0 1px 2px rgba(20, 32, 43, 0.05), 0 10px 28px rgba(20, 32, 43, 0.07);
  --radius: 18px;
  --tap: 48px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Hiragino Sans TC", "Noto Sans TC", "Source Han Sans TC", "Helvetica Neue", sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0d141b;
  --surface: #172029;
  --surface-2: #1e2a35;
  --text: #eef2f6;
  --muted: #9aa7b3;
  --line: rgba(255, 255, 255, 0.09);
  --accent: #4db8c7;
  --accent-hover: #6ec8d4;
  --accent-soft: rgba(77, 184, 199, 0.14);
  --danger: #ff8a80;
  --danger-soft: rgba(255, 138, 128, 0.12);
  --money: #5dca91;
  --ok: #5dca91;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 28px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d141b;
    --surface: #172029;
    --surface-2: #1e2a35;
    --text: #eef2f6;
    --muted: #9aa7b3;
    --line: rgba(255, 255, 255, 0.09);
    --accent: #4db8c7;
    --accent-hover: #6ec8d4;
    --accent-soft: rgba(77, 184, 199, 0.14);
    --danger: #ff8a80;
    --danger-soft: rgba(255, 138, 128, 0.12);
    --money: #5dca91;
    --ok: #5dca91;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 28px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
body { padding-bottom: calc(24px + var(--safe-b)); }
button, input, textarea, select { font: inherit; color: inherit; }
button {
  appearance: none;
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
}
img { display: block; }
h1, h2, h3, p { margin: 0; }
.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding: 0 16px;
}
header.appbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  padding: calc(10px + var(--safe-t)) 16px 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--line);
}
header.appbar .brand {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  min-width: 0;
}
header.appbar .brand img {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  flex-shrink: 0;
}
header.appbar h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.icon-btn {
  width: var(--tap);
  height: var(--tap);
  border-radius: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  flex-shrink: 0;
  background: var(--surface);
  box-shadow: 0 1px 2px rgba(20, 32, 43, 0.05);
}
.icon-btn:active { transform: scale(0.96); opacity: 0.85; }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.add {
  background: var(--accent);
  color: #fff;
  box-shadow: none;
}
:root[data-theme="dark"] .icon-btn.add { color: #0d141b; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .icon-btn.add { color: #0d141b; }
}
.summary {
  margin: 16px 0 12px;
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px 16px 14px;
}
.summary .totals {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 16px;
}
.summary .label {
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
  letter-spacing: 0.02em;
}
.summary .value {
  font-size: 28px;
  font-weight: 760;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  line-height: 1.15;
  margin-top: 2px;
}
.summary .value.money { color: var(--money); }
.summary .sub {
  margin-top: 10px;
  color: var(--muted);
  font-size: 13px;
}
.summary hr {
  border: 0;
  border-top: 1px solid var(--line);
  margin: 14px 0;
}
.break-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 8px;
}
.rows { display: flex; flex-direction: column; gap: 6px; }
.row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  font-size: 14px;
}
.row .k { color: var(--text); }
.row .v { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.filters {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding: 4px 0 14px;
  scrollbar-width: none;
}
.filters::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  height: 36px;
  padding: 0 14px;
  border-radius: 999px;
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--line);
}
.chip[aria-pressed="true"] {
  background: var(--accent);
  color: #fff;
  border-color: transparent;
}
:root[data-theme="dark"] .chip[aria-pressed="true"] { color: #0d141b; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .chip[aria-pressed="true"] { color: #0d141b; }
}
.chip:active { transform: scale(0.97); }
.group-h {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 6px 4px 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  position: sticky;
  top: calc(58px + var(--safe-t));
  background: var(--bg);
  z-index: 5;
}
.group-h .meta { font-weight: 600; font-variant-numeric: tabular-nums; }
.card {
  background: var(--surface);
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  width: 100%;
  text-align: left;
  display: block;
}
.card:active { transform: scale(0.99); }
.card .top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.card .date { font-weight: 700; font-size: 16px; }
.card .price {
  font-weight: 760;
  font-variant-numeric: tabular-nums;
  color: var(--money);
  white-space: nowrap;
}
.card .meta {
  margin-top: 4px;
  color: var(--muted);
  font-size: 13px;
}
.card .note {
  margin-top: 8px;
  font-size: 13px;
  color: var(--text);
  background: var(--surface-2);
  border-radius: 10px;
  padding: 8px 10px;
  white-space: pre-wrap;
  word-break: break-word;
}
.badges { display: inline-flex; gap: 6px; flex-wrap: wrap; vertical-align: middle; }
.badge {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  border-radius: 7px;
  font-size: 11px;
  font-weight: 700;
  background: var(--accent-soft);
  color: var(--accent);
}
.empty {
  text-align: center;
  padding: 48px 20px 32px;
  color: var(--muted);
}
.empty strong { display: block; color: var(--text); font-size: 18px; margin: 8px 0 6px; }
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 16, 22, 0.45);
  z-index: 40;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.overlay.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 50;
  max-width: 560px;
  margin: 0 auto;
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.2);
  padding: 8px 16px calc(16px + var(--safe-b));
  max-height: min(92vh, 920px);
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  transform: translateY(110%);
  transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.sheet.show { transform: translateY(0); }
@media (prefers-reduced-motion: reduce) {
  .overlay, .sheet, .icon-btn, .chip, .card, .toast { transition: none; }
}
.grab {
  width: 36px;
  height: 4px;
  border-radius: 4px;
  background: var(--line);
  margin: 6px auto 12px;
}
.sheet h2 { font-size: 18px; font-weight: 750; margin-bottom: 14px; }
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 6px;
}
.field .err { color: var(--danger); font-size: 12px; margin-top: 6px; display: none; }
.field.has-err .err { display: block; }
.field.has-err input, .field.has-err textarea {
  border-color: var(--danger);
}
input[type="date"], input[type="text"], input[type="tel"], textarea {
  width: 100%;
  min-height: var(--tap);
  border: 1px solid var(--line);
  background: var(--surface-2);
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 16px;
  outline: none;
}
input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { min-height: 88px; resize: vertical; }
.seg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.seg button {
  min-height: var(--tap);
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-weight: 700;
}
.seg button[aria-pressed="true"] {
  background: var(--accent);
  color: #fff;
  border-color: transparent;
}
:root[data-theme="dark"] .seg button[aria-pressed="true"] { color: #0d141b; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { color: #0d141b; }
}
.price-wrap { position: relative; }
.price-wrap .yen {
  position: absolute;
  left: 14px;
  top: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  color: var(--muted);
  font-weight: 700;
  pointer-events: none;
}
.price-wrap input { padding-left: 32px; font-variant-numeric: tabular-nums; }
.resort-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding: 8px 0 2px;
  scrollbar-width: none;
}
.resort-chips::-webkit-scrollbar { display: none; }
.resort-chips button {
  flex-shrink: 0;
  height: 34px;
  padding: 0 12px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-size: 13px;
  font-weight: 600;
}
.resort-chips button[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}
.actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 8px;
}
.btn {
  min-height: var(--tap);
  border-radius: 14px;
  font-weight: 750;
  padding: 0 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
}
.btn:active { transform: scale(0.99); opacity: 0.9; }
.btn.primary { background: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0d141b; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .btn.primary { color: #0d141b; }
}
.btn.ghost { background: var(--surface-2); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.hint {
  font-size: 13px;
  color: var(--muted);
  background: var(--surface-2);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 14px;
  line-height: 1.55;
}
.menu-btn {
  width: 100%;
  min-height: 52px;
  border-radius: 14px;
  background: var(--surface-2);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  font-weight: 700;
  margin-bottom: 8px;
  text-align: left;
}
.menu-btn span.sub { font-weight: 500; color: var(--muted); font-size: 12px; }
.dialog {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) scale(0.96);
  width: calc(100% - 40px);
  max-width: 360px;
  background: var(--surface);
  border-radius: 20px;
  padding: 22px 18px 16px;
  z-index: 60;
  box-shadow: var(--shadow);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.dialog.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
.dialog h2 { font-size: 18px; margin-bottom: 8px; }
.dialog p { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
.dialog .row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + var(--safe-b));
  transform: translate(-50%, 16px);
  background: var(--text);
  color: var(--bg);
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 700;
  z-index: 80;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  max-width: calc(100% - 32px);
  text-align: center;
  box-shadow: var(--shadow);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.copy-box {
  display: none;
  margin-top: 8px;
}
.copy-box.show { display: block; }
.copy-box textarea {
  min-height: 120px;
  font-size: 12px;
  font-family: ui-monospace, Menlo, monospace;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}

    if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
    return "r-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  }

  function todayISO() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function seasonOf(dateStr) {
    var parts = dateStr.split("-");
    var y = Number(parts[0]);
    var m = Number(parts[1]);
    if (m >= 11) return { start: y, end: y + 1 };
    return { start: y - 1, end: y };
  }

  function seasonKey(s) { return s.start + "-" + s.end; }

  function seasonLabel(s) {
    return s.start + "–" + String(s.end).slice(-2) + " 雪季";
  }

  function monthKey(dateStr) { return dateStr.slice(0, 7); }

  function monthLabel(key) {
    var p = key.split("-");
    return Number(p[0]) + "年" + Number(p[1]) + "月";
  }

  function formatDate(iso) {
    var p = iso.split("-").map(Number);
    var dt = new Date(p[0], p[1] - 1, p[2]);
    var week = ["日", "一", "二", "三", "四", "五", "六"][dt.getDay()];
    return p[0] + "年" + p[1] + "月" + p[2] + "日（" + week + "）";
  }

  function formatDateShort(iso) {
    var p = iso.split("-").map(Number);
    var dt = new Date(p[0], p[1] - 1, p[2]);
    var week = ["日", "一", "二", "三", "四", "五", "六"][dt.getDay()];
    return p[1] + "月" + p[2] + "日（" + week + "）";
  }

  function formatYen(n) {
    return "¥" + Number(n).toLocaleString("zh-TW");
  }

  function formatDays(n) {
    var rounded = Math.round(n * 2) / 2;
    return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
  }

  function daysOf(rec) { return rec.period === "full" ? 1 : 0.5; }

  function periodLabel(p) { return p === "full" ? "全天" : "半天"; }

  function boardLabel(b) { return b === "snowboard" ? "單板" : "雙板"; }

  function normalizeDigits(s) {
    return String(s)
      .replace(/[０-９]/g, function (ch) { return String.fromCharCode(ch.charCodeAt(0) - 0xFF10 + 0x30); })
      .replace(/[¥￥$,，\s]/g, "");
  }

  function parsePrice(s) {
    var t = normalizeDigits(s);
    if (!/^\d+$/.test(t)) return null;
    var n = Number(t);
    if (!Number.isFinite(n) || n > 999999999) return null;
    return n;
  }

  function loadRecords() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) { records = []; return; }
      var data = JSON.parse(raw);
      records = Array.isArray(data) ? data : (Array.isArray(data.records) ? data.records : []);
      records = records.filter(isValidRecord).map(normalizeRecord);
    } catch (e) {
      records = [];
    }
  }

  function isValidRecord(r) {
    if (!r || typeof r !== "object") return false;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(r.date || ""))) return false;
    if (r.period !== "full" && r.period !== "half") return false;
    if (r.board !== "snowboard" && r.board !== "ski") return false;
    if (!Number.isFinite(Number(r.price)) || Number(r.price) < 0) return false;
    if (!String(r.resort || "").trim()) return false;
    return true;
  }

  function normalizeRecord(r) {
    return {
      id: r.id || uid(),
      date: r.date,
      period: r.period,
      price: Math.floor(Number(r.price)),
      resort: String(r.resort).trim(),
      board: r.board,
      note: r.note ? String(r.note) : "",
      createdAt: r.createdAt || Date.now(),
      updatedAt: r.updatedAt || r.createdAt || Date.now()
    };
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, records: records }));
      return true;
    } catch (e) {
      toast("無法儲存。瀏覽器可能封鎖了本機儲存空間，請改用匯出備份。");
      return false;
    }
  }

  function applyTheme(theme) {
    var root = document.documentElement;
    if (!theme || theme === "system") {
      root.removeAttribute("data-theme");
      try { localStorage.setItem(THEME_KEY, "system"); } catch (e) {}
    } else {
      root.setAttribute("data-theme", theme);
      try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    }
    updateThemeButton();
  }

  function currentThemePref() {
    try { return localStorage.getItem(THEME_KEY) || "system"; } catch (e) { return "system"; }
  }

  function isDarkNow() {
    var pref = currentThemePref();
    if (pref === "dark") return true;
    if (pref === "light") return false;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }

  function updateThemeButton() {
    var btn = $("themeBtn");
    if (!btn) return;
    var dark = isDarkNow();
    btn.setAttribute("aria-label", dark ? "切換淺色模式" : "切換深色模式");
    btn.innerHTML = dark
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>';
  }

  function filteredRecords() {
    return records.filter(function (r) {
      if (filter === "all") return true;
      if (filter.indexOf("season:") === 0) {
        var key = filter.slice(7);
        return seasonKey(seasonOf(r.date)) === key;
      }
      if (filter.indexOf("month:") === 0) {
        return monthKey(r.date) === filter.slice(6);
      }
      return true;
    });
  }

  function sortRecords(list) {
    return list.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
  }

  function summarize(list) {
    var full = 0, half = 0, income = 0;
    var boards = { snowboard: { days: 0, income: 0, count: 0 }, ski: { days: 0, income: 0, count: 0 } };
    var resorts = {};
    list.forEach(function (r) {
      var d = daysOf(r);
      if (r.period === "full") full += 1; else half += 1;
      income += r.price;
      boards[r.board].days += d;
      boards[r.board].income += r.price;
      boards[r.board].count += 1;
      if (!resorts[r.resort]) resorts[r.resort] = { days: 0, income: 0, count: 0 };
      resorts[r.resort].days += d;
      resorts[r.resort].income += r.price;
      resorts[r.resort].count += 1;
    });
    return { days: full + half * 0.5, full: full, half: half, income: income, boards: boards, resorts: resorts };
  }

  function usedResorts() {
    var seen = {};
    var extras = [];
    records.forEach(function (r) {
      if (DEFAULT_RESORTS.indexOf(r.resort) === -1 && !seen[r.resort]) {
        seen[r.resort] = true;
        extras.push(r.resort);
      }
    });
    extras.sort(function (a, b) { return a.localeCompare(b, "zh-Hant"); });
    return DEFAULT_RESORTS.concat(extras);
  }

  function toast(msg) {
    var el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2400);
  }

  function showOverlay(yes) {
    $("overlay").classList.toggle("show", !!yes);
  }

  function closePanels(fromPop) {
    ["formSheet", "backupSheet"].forEach(function (id) {
      $(id).classList.remove("show");
    });
    $("confirmDialog").classList.remove("show");
    showOverlay(false);
    var was = openPanel;
    openPanel = null;
    if (was && !fromPop && history.state && history.state.skiLog) {
      history.back();
    }
  }

  function openPanelNamed(name) {
    closePanels(true);
    showOverlay(true);
    if (name === "form") $("formSheet").classList.add("show");
    if (name === "backup") $("backupSheet").classList.add("show");
    if (!openPanel) history.pushState({ skiLog: name }, "");
    else history.replaceState({ skiLog: name }, "");
    openPanel = name;
  }

  function renderFilters() {
    var seasons = {};
    var months = {};
    records.forEach(function (r) {
      var s = seasonOf(r.date);
      seasons[seasonKey(s)] = s;
      months[monthKey(r.date)] = true;
    });
    var seasonList = Object.keys(seasons).sort().reverse();
    var monthList = Object.keys(months).sort().reverse();
    var html = '<button type="button" class="chip" data-filter="all" aria-pressed="' + (filter === "all") + '">全部</button>';
    seasonList.forEach(function (k) {
      var id = "season:" + k;
      html += '<button type="button" class="chip" data-filter="' + esc(id) + '" aria-pressed="' + (filter === id) + '">' + esc(seasonLabel(seasons[k])) + "</button>";
    });
    monthList.forEach(function (k) {
      var id = "month:" + k;
      html += '<button type="button" class="chip" data-filter="' + esc(id) + '" aria-pressed="' + (filter === id) + '">' + esc(monthLabel(k)) + "</button>";
    });
    $("filters").innerHTML = html;
  }

  function renderSummary() {
    var list = filteredRecords();
    var s = summarize(list);
    var boardHtml = "";
    [["snowboard", "單板"], ["ski", "雙板"]].forEach(function (pair) {
      var b = s.boards[pair[0]];
      if (!b.count) return;
      boardHtml += '<div class="row"><span class="k">' + pair[1] + " · " + formatDays(b.days) + ' 天</span><span class="v">' + formatYen(b.income) + "</span></div>";
    });
    var resortKeys = Object.keys(s.resorts).sort(function (a, b) {
      return s.resorts[b].income - s.resorts[a].income || a.localeCompare(b, "zh-Hant");
    });
    var resortHtml = resortKeys.map(function (name) {
      var r = s.resorts[name];
      return '<div class="row"><span class="k">' + esc(name) + " · " + formatDays(r.days) + ' 天</span><span class="v">' + formatYen(r.income) + "</span></div>";
    }).join("");

    $("summary").innerHTML =
      '<div class="totals">' +
        '<div><div class="label">總天數</div><div class="value">' + formatDays(s.days) + '</div></div>' +
        '<div><div class="label">總收入</div><div class="value money">' + formatYen(s.income) + "</div></div>" +
      "</div>" +
      '<div class="sub">全天 ' + s.full + " 次 · 半天 " + s.half + " 次" + (list.length !== records.length ? "（依目前篩選）" : "") + "</div>" +
      (boardHtml ? "<hr><div class=\"break-title\">板類</div><div class=\"rows\">" + boardHtml + "</div>" : "") +
      (resortHtml ? "<hr><div class=\"break-title\">雪場</div><div class=\"rows\">" + resortHtml + "</div>" : "");
  }

  function renderList() {
    var list = sortRecords(filteredRecords());
    var el = $("list");
    var empty = $("empty");
    if (!list.length) {
      el.innerHTML = "";
      empty.style.display = "block";
      empty.innerHTML = records.length
        ? "<strong>這個範圍沒有紀錄</strong>試試切換上方的月份或雪季。"
        : "<strong>還沒有紀錄</strong>點右上角＋，記下第一筆教課。";
      return;
    }
    empty.style.display = "none";
    var groups = [];
    var map = {};
    list.forEach(function (r) {
      var k = monthKey(r.date);
      if (!map[k]) {
        map[k] = { key: k, items: [] };
        groups.push(map[k]);
      }
      map[k].items.push(r);
    });
    el.innerHTML = groups.map(function (g) {
      var sum = summarize(g.items);
      var cards = g.items.map(function (r) {
        var note = r.note ? '<div class="note">' + esc(r.note) + "</div>" : "";
        return (
          '<button type="button" class="card" data-id="' + esc(r.id) + '" aria-label="編輯 ' + esc(formatDate(r.date)) + " " + esc(r.resort) + '">' +
            '<div class="top"><div class="date">' + esc(formatDateShort(r.date)) + "</div><div class=\"price\">" + formatYen(r.price) + "</div></div>" +
            '<div class="meta"><span class="badges"><span class="badge">' + periodLabel(r.period) + "</span><span class=\"badge\">" + boardLabel(r.board) + "</span></span> · " + esc(r.resort) + "</div>" +
            note +
          "</button>"
        );
      }).join("");
      return '<div class="group-h"><span>' + esc(monthLabel(g.key)) + "</span><span class=\"meta\">" + formatDays(sum.days) + " 天 · " + formatYen(sum.income) + "</span></div>" + cards;
    }).join("");
  }

  function render() {
    if (filter !== "all") {
      var exists = false;
      if (filter.indexOf("season:") === 0) {
        exists = records.some(function (r) { return seasonKey(seasonOf(r.date)) === filter.slice(7); });
      } else if (filter.indexOf("month:") === 0) {
        exists = records.some(function (r) { return monthKey(r.date) === filter.slice(6); });
      }
      if (!exists) filter = "all";
    }
    renderFilters();
    renderSummary();
    renderList();
    renderDatalist();
  }

  function renderDatalist() {
    $("resortList").innerHTML = usedResorts().map(function (name) {
      return '<option value="' + esc(name) + '">';
    }).join("");
  }

  function renderResortChips(selected) {
    var html = usedResorts().map(function (name) {
      var on = selected === name;
      return '<button type="button" data-resort="' + esc(name) + '" aria-pressed="' + on + '">' + esc(name) + "</button>";
    }).join("");
    $("resortChips").innerHTML = html;
  }

  function setSeg(name, value) {
    document.querySelectorAll('[data-seg="' + name + '"]').forEach(function (btn) {
      btn.setAttribute("aria-pressed", btn.getAttribute("data-value") === value ? "true" : "false");
    });
  }

  function getSeg(name) {
    var el = document.querySelector('[data-seg="' + name + '"][aria-pressed="true"]');
    return el ? el.getAttribute("data-value") : "";
  }

  function clearFieldErrors() {
    document.querySelectorAll(".field.has-err").forEach(function (f) { f.classList.remove("has-err"); });
  }

  function showFieldError(id, msg) {
    var field = $(id).closest(".field");
    field.classList.add("has-err");
    field.querySelector(".err").textContent = msg;
  }

  function openForm(rec) {
    clearFieldErrors();
    editingId = rec ? rec.id : null;
    $("formTitle").textContent = rec ? "編輯紀錄" : "新增紀錄";
    $("formDate").value = rec ? rec.date : todayISO();
    setSeg("period", rec ? rec.period : "full");
    setSeg("board", rec ? rec.board : "snowboard");
    $("formPrice").value = rec ? String(rec.price) : "";
    $("formResort").value = rec ? rec.resort : "";
    $("formNote").value = rec ? rec.note : "";
    $("formDelete").style.display = rec ? "block" : "none";
    renderResortChips(rec ? rec.resort : "");
    $("copyBox").classList.remove("show");
    openPanelNamed("form");
    setTimeout(function () { $("formDate").blur(); }, 0);
  }

  function saveForm() {
    clearFieldErrors();
    var date = $("formDate").value;
    var period = getSeg("period");
    var board = getSeg("board");
    var price = parsePrice($("formPrice").value);
    var resort = $("formResort").value.trim();
    var note = $("formNote").value.trim();
    var ok = true;
    if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) {
      showFieldError("formDate", "請選擇日期");
      ok = false;
    }
    if (period !== "full" && period !== "half") {
      showFieldError("formPeriod", "請選擇時段");
      ok = false;
    }
    if (price === null) {
      showFieldError("formPrice", "請輸入日圓整數，例如 25000");
      ok = false;
    }
    if (!resort) {
      showFieldError("formResort", "請填寫雪場");
      ok = false;
    }
    if (board !== "snowboard" && board !== "ski") {
      showFieldError("formBoard", "請選擇板類");
      ok = false;
    }
    if (!ok) return;

    var now = Date.now();
    if (editingId) {
      var idx = records.findIndex(function (r) { return r.id === editingId; });
      if (idx === -1) {
        toast("找不到這筆紀錄");
        return;
      }
      records[idx] = Object.assign({}, records[idx], {
        date: date, period: period, price: price, resort: resort, board: board, note: note, updatedAt: now
      });
    } else {
      records.push({
        id: uid(), date: date, period: period, price: price, resort: resort, board: board, note: note,
        createdAt: now, updatedAt: now
      });
    }
    if (!persist()) return;
    closePanels();
    render();
    toast(editingId ? "已更新" : "已記下一筆");
  }

  function askDelete() {
    if (!editingId) return;
    var rec = records.find(function (r) { return r.id === editingId; });
    var text = rec
      ? "確定刪除 " + formatDate(rec.date) + "「" + rec.resort + "」這筆紀錄？刪除後無法復原。"
      : "確定刪除這筆紀錄？刪除後無法復原。";
    $("confirmTitle").textContent = "刪除紀錄";
    $("confirmText").textContent = text;
    $("confirmOk").textContent = "刪除";
    $("confirmOk").className = "btn danger";
    $("confirmDialog").dataset.mode = "delete";
    $("confirmDialog").classList.add("show");
    showOverlay(true);
  }

  function doDelete() {
    if (!editingId) return;
    records = records.filter(function (r) { return r.id !== editingId; });
    persist();
    $("confirmDialog").classList.remove("show");
    closePanels();
    render();
    toast("已刪除");
  }

  function exportPayload() {
    return {
      app: "ski-work-log",
      version: 1,
      exportedAt: new Date().toISOString(),
      records: records
    };
  }

  function toCSV(list) {
    var header = ["日期", "時段", "價錢", "雪場", "板類", "備註"];
    function cell(v) {
      var s = String(v == null ? "" : v);
      if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }
    var lines = [header.join(",")];
    sortRecords(list).slice().reverse().forEach(function (r) {
      lines.push([r.date, periodLabel(r.period), r.price, r.resort, boardLabel(r.board), r.note].map(cell).join(","));
    });
    return "\uFEFF" + lines.join("\r\n");
  }

  function filenameStamp() {
    var d = new Date();
    function z(n) { return String(n).padStart(2, "0"); }
    return d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate());
  }

  async function shareOrDownload(filename, content, mime) {
    var blob = new Blob([content], { type: mime });
    var file;
    try { file = new File([blob], filename, { type: mime }); } catch (e) { file = null; }
    if (file && navigator.canShare) {
      try {
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: filename });
          toast("已開啟分享");
          return;
        }
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
    }
    try {
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      toast("已開始下載");
      return;
    } catch (e) {}
    $("copyBox").classList.add("show");
    $("copyArea").value = content.replace(/^\uFEFF/, "");
    $("copyArea").focus();
    $("copyArea").select();
    toast("無法直接下載，請複製下方內容自行存檔");
  }

  function importJSONText(text, mode) {
    var data;
    try { data = JSON.parse(text); } catch (e) {
      toast("這個檔案不是有效的 JSON");
      return;
    }
    var incoming = [];
    if (Array.isArray(data)) incoming = data;
    else if (data && Array.isArray(data.records)) incoming = data.records;
    else {
      toast("找不到紀錄資料");
      return;
    }
    var valid = incoming.filter(isValidRecord).map(normalizeRecord);
    var skipped = incoming.length - valid.length;
    if (!valid.length) {
      toast("沒有可匯入的紀錄");
      return;
    }
    if (mode === "replace") {
      records = valid;
    } else {
      var byId = {};
      records.forEach(function (r) { byId[r.id] = r; });
      valid.forEach(function (r) { byId[r.id] = r; });
      records = Object.keys(byId).map(function (k) { return byId[k]; });
    }
    if (!persist()) return;
    closePanels();
    render();
    toast("已匯入 " + valid.length + " 筆" + (skipped ? "，略過 " + skipped + " 筆格式不符" : ""));
  }

  function askImport(text) {
    $("pendingImport").value = text;
    $("confirmTitle").textContent = "匯入備份";
    $("confirmText").textContent = "要合併到現有紀錄，還是用這個檔案取代全部？合併時，相同編號的紀錄會被更新。";
    $("confirmOk").textContent = "合併";
    $("confirmOk").className = "btn primary";
    $("confirmAlt").style.display = "block";
    $("confirmDialog").dataset.mode = "import";
    $("confirmDialog").classList.add("show");
    showOverlay(true);
  }

  function onReady() {
    applyTheme(currentThemePref());
    if (window.matchMedia) {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", updateThemeButton);
    }
    loadRecords();
    render();

    $("addBtn").addEventListener("click", function () { openForm(null); });
    $("backupBtn").addEventListener("click", function () {
      $("copyBox").classList.remove("show");
      openPanelNamed("backup");
    });
    $("themeBtn").addEventListener("click", function () {
      applyTheme(isDarkNow() ? "light" : "dark");
    });
    $("overlay").addEventListener("click", function () {
      $("confirmDialog").classList.remove("show");
      closePanels();
    });
    $("formCancel").addEventListener("click", function () { closePanels(); });
    $("backupClose").addEventListener("click", function () { closePanels(); });
    $("recordForm").addEventListener("submit", function (e) { e.preventDefault(); saveForm(); });
    $("formDelete").addEventListener("click", askDelete);

    $("filters").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-filter]");
      if (!btn) return;
      filter = btn.getAttribute("data-filter");
      render();
    });

    $("list").addEventListener("click", function (e) {
      var btn = e.target.closest(".card");
      if (!btn) return;
      var rec = records.find(function (r) { return r.id === btn.getAttribute("data-id"); });
      if (rec) openForm(rec);
    });

    document.getElementById("formPeriod").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-seg=period]");
      if (!btn) return;
      setSeg("period", btn.getAttribute("data-value"));
    });
    document.getElementById("formBoard").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-seg=board]");
      if (!btn) return;
      setSeg("board", btn.getAttribute("data-value"));
    });

    $("resortChips").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-resort]");
      if (!btn) return;
      $("formResort").value = btn.getAttribute("data-resort");
      renderResortChips($("formResort").value);
    });
    $("formResort").addEventListener("input", function () {
      renderResortChips($("formResort").value.trim());
    });

    $("exportJson").addEventListener("click", function () {
      shareOrDownload("ski-log-" + filenameStamp() + ".json", JSON.stringify(exportPayload(), null, 2), "application/json");
    });
    $("exportCsv").addEventListener("click", function () {
      shareOrDownload("ski-log-" + filenameStamp() + ".csv", toCSV(records), "text/csv;charset=utf-8");
    });
    $("importBtn").addEventListener("click", function () { $("fileInput").click(); });
    $("fileInput").addEventListener("change", function (e) {
      var file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () { askImport(String(reader.result || "")); };
      reader.onerror = function () { toast("讀取檔案失敗"); };
      reader.readAsText(file, "utf-8");
    });
    $("copyNow").addEventListener("click", function () {
      var text = $("copyArea").value;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast("已複製"); }).catch(function () { fallbackCopy(text); });
      } else fallbackCopy(text);
    });

    $("confirmCancel").addEventListener("click", function () {
      $("confirmDialog").classList.remove("show");
      if (openPanel) showOverlay(true);
      else closePanels();
      $("confirmAlt").style.display = "none";
    });
    $("confirmOk").addEventListener("click", function () {
      var mode = $("confirmDialog").dataset.mode;
      $("confirmAlt").style.display = "none";
      $("confirmDialog").classList.remove("show");
      if (mode === "delete") doDelete();
      else if (mode === "import") importJSONText($("pendingImport").value, "merge");
    });
    $("confirmAlt").addEventListener("click", function () {
      $("confirmAlt").style.display = "none";
      $("confirmDialog").classList.remove("show");
      importJSONText($("pendingImport").value, "replace");
    });

    window.addEventListener("popstate", function () {
      $("confirmDialog").classList.remove("show");
      $("confirmAlt").style.display = "none";
      if (openPanel) closePanels(true);
    });
  }

  function fallbackCopy(text) {
    $("copyArea").value = text;
    $("copyArea").select();
    try {
      document.execCommand("copy");
      toast("已複製");
    } catch (e) {
      toast("請手動複製");
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", onReady);
  else onReady();
})();

  </script>
</body>
</html>
