  <style>
:root {
  --bg: #e8eef3;
  --surface: #ffffff;
  --surface-2: #f4f7fa;
  --text: #14202b;
  --muted: #5c6b78;
  --line: rgba(20, 32, 43, 0.09);
  --accent: #0c6d7c;
  --accent-hover: #0a5c69;
  --accent-soft: #e3f2f4;
  --danger: #c62828;
  --danger-soft: #fdecec;
  --money: #0a7a4a;
  --ok: #0a7a4a;
  --shadow: 0 1px 2px rgba(20, 32, 43, 0.05), 0 10px 28px rgba(20, 32, 43, 0.07);
  --radius: 18px;
  --tap: 48px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Hiragino Sans TC", "Noto Sans TC", "Source Han Sans TC", "Helvetica Neue", sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0d141b;
  --surface: #172029;
  --surface-2: #1e2a35;
  --text: #eef2f6;
  --muted: #9aa7b3;
  --line: rgba(255, 255, 255, 0.09);
  --accent: #4db8c7;
  --accent-hover: #6ec8d4;
  --accent-soft: rgba(77, 184, 199, 0.14);
  --danger: #ff8a80;
  --danger-soft: rgba(255, 138, 128, 0.12);
  --money: #5dca91;
  --ok: #5dca91;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 28px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d141b;
    --surface: #172029;
    --surface-2: #1e2a35;
    --text: #eef2f6;
    --muted: #9aa7b3;
    --line: rgba(255, 255, 255, 0.09);
    --accent: #4db8c7;
    --accent-hover: #6ec8d4;
    --accent-soft: rgba(77, 184, 199, 0.14);
    --danger: #ff8a80;
    --danger-soft: rgba(255, 138, 128, 0.12);
    --money: #5dca91;
    --ok: #5dca91;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 28px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  max-width: 100%;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
body { padding-bottom: calc(24px + var(--safe-b)); }
button, input, textarea, select { font: inherit; color: inherit; }
button {
  appearance: none;
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
}
img { display: block; }
h1, h2, h3, p { margin: 0; }
.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding: 0 16px;
}
header.appbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  padding: calc(10px + var(--safe-t)) 16px 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--line);
}
header.appbar .brand {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  min-width: 0;
}
header.appbar .brand img {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  flex-shrink: 0;
}
header.appbar h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.icon-btn {
  width: var(--tap);
  height: var(--tap);
  border-radius: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  flex-shrink: 0;
  background: var(--surface);
  box-shadow: 0 1px 2px rgba(20, 32, 43, 0.05);
}
.icon-btn:active { transform: scale(0.96); opacity: 0.85; }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.add {
  background: var(--accent);
  color: #fff;
  box-shadow: none;
}
:root[data-theme="dark"] .icon-btn.add { color: #0d141b; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .icon-btn.add { color: #0d141b; }
}
.summary {
  margin: 16px 0 12px;
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px 16px 14px;
}
.summary .totals {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 16px;
}
.summary .label {
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
  letter-spacing: 0.02em;
}
.summary .value {
  font-size: 28px;
  font-weight: 760;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  line-height: 1.15;
  margin-top: 2px;
}
.summary .value.money { color: var(--money); }
.summary .sub {
  margin-top: 10px;
  color: var(--muted);
  font-size: 13px;
}
.summary hr {
  border: 0;
  border-top: 1px solid var(--line);
  margin: 14px 0;
}
.break-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 8px;
}
.rows { display: flex; flex-direction: column; gap: 6px; }
.row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  font-size: 14px;
}
.row .k { color: var(--text); }
.row .v { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.filters {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding: 4px 0 14px;
  scrollbar-width: none;
}
.filters::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  height: 36px;
  padding: 0 14px;
  border-radius: 999px;
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--line);
}
.chip[aria-pressed="true"] {
  background: var(--accent);
  color: #fff;
  border-color: transparent;
}
:root[data-theme="dark"] .chip[aria-pressed="true"] { color: #0d141b; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .chip[aria-pressed="true"] { color: #0d141b; }
}
.chip:active { transform: scale(0.97); }
.group-h {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 6px 4px 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  position: sticky;
  top: calc(58px + var(--safe-t));
  background: var(--bg);
  z-index: 5;
}
.group-h .meta { font-weight: 600; font-variant-numeric: tabular-nums; }
.card {
  background: var(--surface);
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  width: 100%;
  text-align: left;
  display: block;
}
.card:active { transform: scale(0.99); }
.card .top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
.card .date { font-weight: 700; font-size: 16px; }
.card .price {
  font-weight: 760;
  font-variant-numeric: tabular-nums;
  color: var(--money);
  white-space: nowrap;
}
.card .meta {
  margin-top: 4px;
  color: var(--muted);
  font-size: 13px;
}
.card .note {
  margin-top: 8px;
  font-size: 13px;
  color: var(--text);
  background: var(--surface-2);
  border-radius: 10px;
  padding: 8px 10px;
  white-space: pre-wrap;
  word-break: break-word;
}
.badges { display: inline-flex; gap: 6px; flex-wrap: wrap; vertical-align: middle; }
.badge {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  border-radius: 7px;
  font-size: 11px;
  font-weight: 700;
  background: var(--accent-soft);
  color: var(--accent);
}
.empty {
  text-align: center;
  padding: 48px 20px 32px;
  color: var(--muted);
}
.empty strong { display: block; color: var(--text); font-size: 18px; margin: 8px 0 6px; }
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 16, 22, 0.45);
  z-index: 40;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.overlay.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 50;
  width: 100%;
  max-width: min(560px, 100%);
  margin: 0 auto;
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.2);
  padding: 8px max(22px, env(safe-area-inset-right, 0px)) calc(16px + var(--safe-b)) max(22px, env(safe-area-inset-left, 0px));
  max-height: min(92vh, 920px);
  overflow-x: hidden;
  overflow-y: auto;
  touch-action: pan-y;
  -webkit-overflow-scrolling: touch;
  transform: translateY(110%);
  transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.sheet.show { transform: translateY(0); }
@media (prefers-reduced-motion: reduce) {
  .overlay, .sheet, .icon-btn, .chip, .card, .toast { transition: none; }
}
.grab {
  width: 36px;
  height: 4px;

  <section class="sheet" id="formSheet" role="dialog" aria-modal="true" aria-labelledby="formTitle">

    <h2 id="formTitle">新增紀錄</h2>

      <div class="field">
        <label for="formDate">日期</label>
        <input id="formDate" type="date" required>
        <div class="err"></div>
      </div>
      <div class="field" id="formPeriodField">
        <label>時段</label>
        <div class="seg" id="formPeriod">
          <button type="button" data-seg="period" data-value="half" aria-pressed="false">半天</button>
          <button type="button" data-seg="period" data-value="full" aria-pressed="true">全天</button>
        </div>
        <div class="err"></div>
      </div>
      <div class="field">
        <label for="formPrice">價錢（日圓）</label>
        <div class="price-wrap">
          <span class="yen" aria-hidden="true">¥</span>
          <input id="formPrice" type="text" inputmode="numeric" autocomplete="off" placeholder="25000">
        </div>
        <div class="err"></div>
      </div>
      <div class="field">
        <label for="formResort">雪場</label>
        <input id="formResort" type="text" list="resortList" autocomplete="off" placeholder="例如 栂池高原">
        <datalist id="resortList"></datalist>
        <div class="resort-chips" id="resortChips"></div>
        <div class="err"></div>
      </div>
      <div class="field">
        <label>板類</label>
        <div class="seg" id="formBoard">
          <button type="button" data-seg="board" data-value="snowboard" aria-pressed="true">單板</button>
          <button type="button" data-seg="board" data-value="ski" aria-pressed="false">雙板</button>
        </div>
        <div class="err"></div>
      </div>
      <div class="field">
        <label for="formGuest">客人名字（選填）</label>
        <input id="formGuest" type="text" list="guestList" maxlength="40" autocomplete="off" placeholder="例如 小明">
        <datalist id="guestList"></datalist>
        <div class="err"></div>
      </div>
      <div class="field">
        <label for="formNote">備註（選填）</label>
        <textarea id="formNote" maxlength="500" placeholder="集合時間等"></textarea>
        <div class="err"></div>
      </div>
      <div class="field" id="feature-guest-photos">
        <div class="photo-grid" id="formPhotos"></div>
        <p class="photo-progress" id="photoProgress"></p>
        <div id="photoCount" class="photo-hint"></div>

        <input id="photoInput" type="file" accept="image/*" multiple hidden>
        <div class="err"></div>
      </div>
      <div class="actions">
        <button type="submit" class="btn primary" id="formSave">儲存</button>
        <button type="button" class="btn ghost" id="formCancel">取消</button>
        <button type="button" class="btn danger" id="formDelete" style="display:none">刪除</button>
      </div>

  <section class="sheet" id="backupSheet" role="dialog" aria-modal="true" aria-labelledby="backupTitle">

    <h2 id="backupTitle">備份與還原</h2>
    <p class="hint">紀錄與照片都只存在這支手機的瀏覽器裡，不會上傳。換手機或清除網站資料前，請先匯出 JSON 備份（含照片）。CSV 只含表格，不含照片。</p>
    <button type="button" class="menu-btn" id="exportJson">匯出 JSON 備份<span class="sub">含照片，完整還原用</span></button>
    <button type="button" class="menu-btn" id="exportCsv">匯出 CSV 表格<span class="sub">可用試算表打開，不含照片</span></button>
    <button type="button" class="menu-btn" id="importBtn">匯入 JSON 備份<span class="sub">可還原紀錄與照片</span></button>
    <input id="fileInput" type="file" accept="application/json,.json,text/json" hidden>
    <div class="copy-box" id="copyBox">
      <textarea id="copyArea" readonly></textarea>
      <button type="button" class="btn primary" id="copyNow" style="margin-top:8px">複製內容</button>
    </div>
    <div class="actions">
      <button type="button" class="btn ghost" id="backupClose">關閉</button>
    </div>
  </section>


  <section class="sheet" id="albumSheet" role="dialog" aria-modal="true" aria-labelledby="albumTitle">
    <div class="grab" aria-hidden="true"></div>
    <h2 id="albumTitle">相簿 <span id="albumCount" style="font-weight:600;color:var(--muted);font-size:14px"></span></h2>
    <p class="hint">依日期和客人名字分組。照片只存在這支手機，不會上傳到網路。</p>
    <div id="albumBody"></div>
    <div class="actions">
      <button type="button" class="btn ghost" id="albumClose">關閉</button>
    </div>
  </section>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="查看照片">
    <div class="viewer-top">
      <button type="button" class="icon-btn" id="viewerClose" aria-label="關閉">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="viewer-meta" id="viewerMeta"></div>
      <button type="button" class="icon-btn" id="viewerDelete" aria-label="刪除這張照片">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>
      </button>
    </div>
    <div class="viewer-stage" id="viewerStage">
      <button type="button" class="viewer-nav prev" id="viewerPrev" aria-label="上一張"></button>
      <img id="viewerImg" alt="">
      <button type="button" class="viewer-nav next" id="viewerNext" aria-label="下一張"></button>
    </div>
  </div>

  <div class="dialog" id="confirmDialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmText">
    <h2 id="confirmTitle">請確認</h2>
    <p id="confirmText"></p>
    <div class="row-btns">
      <button type="button" class="btn ghost" id="confirmCancel">取消</button>
      <button type="button" class="btn danger" id="confirmOk">刪除</button>
    </div>
    <button type="button" class="btn ghost" id="confirmAlt" style="display:none;margin-top:8px">取代全部</button>
  </div>
  <textarea id="pendingImport" class="sr" hidden aria-hidden="true"></textarea>
  <div class="toast" id="toast" role="status"></div>

  <script>

(function () {
  "use strict";

  var STORAGE_KEY = "ski-work-log-v1";
  var THEME_KEY = "ski-work-log-theme";
  var IDB_NAME = "ski-work-log-idb";
  var DEFAULT_RESORTS = ["八方尾根", "栂池高原", "岩岳", "五龍&47", "白馬Cortina", "乘鞍", "鹿島槍", "Sanosaka"];
  var MAX_EDGE = 1600;
  var JPEG_QUALITY = 0.8;
  var THUMB_EDGE = 360;
  var MAX_PHOTOS_PER_RECORD = 40;

  var records = [];
  var filter = "all";
  var editingId = null;
  var formRecordId = null;
  var formIsNew = false;
  var formSaved = false;
  var openPanel = null;
  var toastTimer = 0;
  var dbPromise = null;
  var photoCache = null;
  var urlCache = {};
  var pendingImportText = "";
  var pendingPreviews = [];
  var photoStorageReady = null;
  var pendingPhotoId = null;
  var viewerList = [];
  var viewerIndex = 0;
  var viewerOpen = false;
  var viewerTouchX = 0;

  var $ = function (id) { return document.getElementById(id); };

  function uid() {
    if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
    return "r-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  }

  function todayISO() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function seasonOf(dateStr) {
    var parts = dateStr.split("-");
    var y = Number(parts[0]);
    var m = Number(parts[1]);
    if (m >= 11) return { start: y, end: y + 1 };
    return { start: y - 1, end: y };
  }

  function seasonKey(s) { return s.start + "-" + s.end; }

  function seasonLabel(s) {
    return s.start + "–" + String(s.end).slice(-2) + " 雪季";
  }

  function monthKey(dateStr) { return dateStr.slice(0, 7); }

  function monthLabel(key) {
    var p = key.split("-");
    return Number(p[0]) + "年" + Number(p[1]) + "月";
  }

  function formatDate(iso) {
    var p = iso.split("-").map(Number);
    var dt = new Date(p[0], p[1] - 1, p[2]);
    var week = ["日", "一", "二", "三", "四", "五", "六"][dt.getDay()];
    return p[0] + "年" + p[1] + "月" + p[2] + "日（" + week + "）";
  }

  function formatDateShort(iso) {
    var p = iso.split("-").map(Number);
    var dt = new Date(p[0], p[1] - 1, p[2]);
    var week = ["日", "一", "二", "三", "四", "五", "六"][dt.getDay()];
    return p[1] + "月" + p[2] + "日（" + week + "）";
  }

  function dateParts(iso) {
    var p = iso.split("-").map(Number);
    var dt = new Date(p[0], p[1] - 1, p[2]);
    var week = ["日", "一", "二", "三", "四", "五", "六"][dt.getDay()];
    return {
      month: p[1] + "月",
      day: p[2] + "日",
      week: week,
      label: p[1] + "月" + p[2] + "日（" + week + "）"
    };
  }

  function formatYen(n) {
    return "¥" + Number(n).toLocaleString("zh-TW");
  }

  function formatDays(n) {
    var rounded = Math.round(n * 2) / 2;
    return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
  }

  function daysOf(rec) { return rec.period === "full" ? 1 : 0.5; }

  function periodLabel(p) { return p === "full" ? "全天" : "半天"; }

  function boardLabel(b) { return b === "snowboard" ? "單板" : "雙板"; }

  function guestLabel(name) { return name && String(name).trim() ? String(name).trim() : "未填名字"; }

  function normalizeDigits(s) {
    return String(s)
      .replace(/[０-９]/g, function (ch) { return String.fromCharCode(ch.charCodeAt(0) - 0xFF10 + 0x30); })
      .replace(/[¥￥$,，\s]/g, "");
  }

  function parsePrice(s) {
    var t = normalizeDigits(s);
    if (!/^\d+$/.test(t)) return null;
    var n = Number(t);
    if (!Number.isFinite(n) || n > 999999999) return null;
    return n;
  }

  function loadRecords() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) { records = []; return; }
      var data = JSON.parse(raw);
      records = Array.isArray(data) ? data : (Array.isArray(data.records) ? data.records : []);
      records = records.filter(isValidRecord).map(normalizeRecord);
    } catch (e) {
      records = [];
    }
  }

  function isValidRecord(r) {
    if (!r || typeof r !== "object") return false;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(r.date || ""))) return false;
    if (r.period !== "full" && r.period !== "half") return false;
    if (r.board !== "snowboard" && r.board !== "ski") return false;
    if (!Number.isFinite(Number(r.price)) || Number(r.price) < 0) return false;
    if (!String(r.resort || "").trim()) return false;
    return true;
  }

  function normalizeRecord(r) {
    return {
      id: r.id || uid(),
      date: r.date,
      period: r.period,
      price: Math.floor(Number(r.price)),
      resort: String(r.resort).trim(),
      board: r.board,
      guestName: r.guestName ? String(r.guestName).trim() : "",
      note: r.note ? String(r.note) : "",
      createdAt: r.createdAt || Date.now(),
      updatedAt: r.updatedAt || r.createdAt || Date.now()
    };
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 2, records: records }));
      return true;
    } catch (e) {
      toast("無法儲存。瀏覽器可能封鎖了本機儲存空間，請改用匯出備份。");
      return false;
    }
  }

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      if (!window.indexedDB) {
        reject(new Error("no-idb"));
        return;
      }
      var req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains("photos")) {
          var store = db.createObjectStore("photos", { keyPath: "id" });
          store.createIndex("recordId", "recordId", { unique: false });
        }
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
    return dbPromise;
  }

  function idbReq(store, method, value) {
    return new Promise(function (resolve, reject) {
      var req = store[method](value);
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  async function allPhotos() {
    if (photoCache) return photoCache;
    var db = await openDB();
    photoCache = await new Promise(function (resolve, reject) {
      var tx = db.transaction("photos", "readonly");
      var req = tx.objectStore("photos").getAll();
      req.onsuccess = function () { resolve(req.result || []); };
      req.onerror = function () { reject(req.error); };
    });
    return photoCache;
  }

  function invalidatePhotos() { photoCache = null; }

  async function photosForRecord(recordId) {
    var list = await allPhotos();
    return list.filter(function (p) { return p.recordId === recordId; })
      .sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
  }

  async function putPhoto(photo) {
    var stored = {
      id: photo.id,
      recordId: photo.recordId,
      createdAt: photo.createdAt || Date.now(),
      width: photo.width || 0,
      height: photo.height || 0,
      mime: photo.mime || "image/jpeg",
      dataUrl: photo.dataUrl,
      thumbUrl: photo.thumbUrl || photo.dataUrl
    };
    if (!stored.dataUrl || String(stored.dataUrl).indexOf("data:") !== 0) {
      throw new Error("missing dataUrl");
    }
    var db = await openDB();
    await new Promise(function (resolve, reject) {
      var tx = db.transaction("photos", "readwrite");
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
      tx.objectStore("photos").put(stored);
    });
    invalidatePhotos();
  }

  async function deletePhotoById(id) {
    var db = await openDB();
    await new Promise(function (resolve, reject) {
      var tx = db.transaction("photos", "readwrite");
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
      tx.objectStore("photos").delete(id);
    });
    revokePhotoUrl(id);
    invalidatePhotos();
  }

  async function deletePhotosForRecord(recordId) {
    var list = await photosForRecord(recordId);
    if (!list.length) return;
    var db = await openDB();
    await new Promise(function (resolve, reject) {
      var tx = db.transaction("photos", "readwrite");
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
      var store = tx.objectStore("photos");
      list.forEach(function (p) { store.delete(p.id); });
    });
    list.forEach(function (p) { revokePhotoUrl(p.id); });
    invalidatePhotos();
  }

  async function clearAllPhotos() {
    var db = await openDB();
    await new Promise(function (resolve, reject) {
      var tx = db.transaction("photos", "readwrite");
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
      tx.objectStore("photos").clear();
    });
    Object.keys(urlCache).forEach(function (k) {
      try { URL.revokeObjectURL(urlCache[k]); } catch (e) {}
    });
    urlCache = {};
    invalidatePhotos();
  }

  function photoURL(photo, useThumb) {
    if (!photo) return "";
    if (useThumb && photo.thumbUrl) return photo.thumbUrl;
    if (photo.dataUrl) return photo.dataUrl;
    if (useThumb && typeof photo.thumb === "string" && photo.thumb.indexOf("data:") === 0) return photo.thumb;
    if (typeof photo.blob === "string" && photo.blob.indexOf("data:") === 0) return photo.blob;
    var blob = useThumb && photo.thumb ? photo.thumb : photo.blob;
    if (!blob || typeof Blob === "undefined" || !(blob instanceof Blob)) return "";
    var key = photo.id + (useThumb ? "-t" : "-f");
    if (urlCache[key]) return urlCache[key];
    try {
      urlCache[key] = URL.createObjectURL(blob);
      return urlCache[key];
    } catch (e) {
      return "";
    }
  }

  function revokePhotoUrl(id) {
    ["-t", "-f"].forEach(function (suf) {
      var key = id + suf;
      if (urlCache[key]) {
        try { URL.revokeObjectURL(urlCache[key]); } catch (e) {}
        delete urlCache[key];
      }
    });
  }

  function canvasToDataURL(canvas, type, quality) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var finish = function (url, err) {
        if (settled) return;
        settled = true;
        if (url && String(url).indexOf("data:") === 0) resolve(url);
        else reject(err || new Error("toDataURL failed"));
      };
      var fallback = function () {
        try {
          var url = canvas.toDataURL(type || "image/jpeg", quality);
          if (url && url.indexOf("data:") === 0 && url.length > 32) { finish(url); return; }
        } catch (e) {}
        try {
          finish(canvas.toDataURL("image/png"));
        } catch (e2) {
          finish(null, e2);
        }
      };
      if (typeof canvas.toBlob !== "function") { fallback(); return; }
      var timer = setTimeout(fallback, 1500);
      try {
        canvas.toBlob(function (blob) {
          clearTimeout(timer);
          if (settled) return;
          if (!blob) { fallback(); return; }
          var reader = new FileReader();
          reader.onload = function () { finish(String(reader.result || "")); };
          reader.onerror = function () { fallback(); };
          reader.readAsDataURL(blob);
        }, type || "image/jpeg", quality);
      } catch (e) {
        clearTimeout(timer);
        fallback();
      }
    });
  }

  function readFileAsDataURL(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var s = String(reader.result || "");
        if (s.indexOf("data:") === 0) resolve(s);
        else reject(new Error("not-data-url"));
      };
      reader.onerror = function () { reject(reader.error || new Error("read fail")); };
      reader.readAsDataURL(file);
    });
  }

  function loadImageFromDataURL(dataUrl) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth || img.width;
        var h = img.naturalHeight || img.height;
        if (!w || !h) reject(new Error("empty image"));
        else resolve(img);
      };
      img.onerror = function () { reject(new Error("image load failed")); };
      img.src = dataUrl;
    });
  }

  function loadImageFromFile(file) {
    var asDataUrl = (typeof file === "string" && file.indexOf("data:") === 0)
      ? Promise.resolve(file)
      : null;
    return Promise.resolve().then(function () {
      if (asDataUrl) return asDataUrl.then(loadImageFromDataURL);
      if (typeof createImageBitmap === "function") {
        return createImageBitmap(file, { imageOrientation: "from-image" }).catch(function () {
          return createImageBitmap(file);
        });
      }
      return Promise.reject(new Error("no-bitmap"));
    }).catch(function () {
      if (asDataUrl) return asDataUrl.then(loadImageFromDataURL);
      return readFileAsDataURL(file).then(loadImageFromDataURL);
    });
  }

  function drawScaled(source, maxEdge) {
    var sw = source.naturalWidth || source.width;
    var sh = source.naturalHeight || source.height;
    var w = sw;
    var h = sh;
    if (w > maxEdge || h > maxEdge) {
      var scale = maxEdge / Math.max(w, h);
      w = Math.max(1, Math.round(w * scale));
      h = Math.max(1, Math.round(h * scale));
    }
    var canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    var ctx = canvas.getContext("2d");
    ctx.drawImage(source, 0, 0, w, h);
    return { canvas: canvas, width: w, height: h };
  }

  async function compressImage(file) {
    var source = await loadImageFromFile(file);
    var full = drawScaled(source, MAX_EDGE);
    var thumb = drawScaled(source, THUMB_EDGE);
    if (source.close) try { source.close(); } catch (e) {}
    var dataUrl = await canvasToDataURL(full.canvas, "image/jpeg", JPEG_QUALITY);
    var thumbUrl = await canvasToDataURL(thumb.canvas, "image/jpeg", 0.7);
    return { dataUrl: dataUrl, thumbUrl: thumbUrl, width: full.width, height: full.height, mime: "image/jpeg" };
  }

  async function storeableFromFile(file) {
    try {
      return await compressImage(file);
    } catch (err) {
      var dataUrl = await readFileAsDataURL(file);
      return {
        dataUrl: dataUrl,
        thumbUrl: dataUrl,
        width: 0,
        height: 0,
        mime: file.type || "image/jpeg",
        raw: true
      };
    }
  }

  async function testPhotoStorage() {
    try {
      if (!window.indexedDB) return false;
      var db = await openDB();
      var id = "__ski_log_idb_test__";
      var sample = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";
      await new Promise(function (resolve, reject) {
        var tx = db.transaction("photos", "readwrite");
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error); };
        tx.objectStore("photos").put({
          id: id, recordId: id, createdAt: 0, width: 1, height: 1,
          mime: "image/gif", dataUrl: sample, thumbUrl: sample
        });
      });
      var read = await new Promise(function (resolve, reject) {
        var tx = db.transaction("photos", "readonly");
        var req = tx.objectStore("photos").get(id);
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
      });
      await new Promise(function (resolve, reject) {
        var tx = db.transaction("photos", "readwrite");
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error); };
        tx.objectStore("photos").delete(id);
      });
      invalidatePhotos();
      return !!(read && typeof read.dataUrl === "string" && read.dataUrl.indexOf("data:") === 0);
    } catch (e) {
      invalidatePhotos();
      return false;
    }
  }

  function ensurePhotoStorage() {
    if (!photoStorageReady) photoStorageReady = testPhotoStorage();
    return photoStorageReady;
  }

  function updatePhotoStorageHint(ok) {
    var el = $("photoStorageHint");
    if (!el) return;
    el.textContent = ok
      ? "照片只存在這支手機，不會上傳到網路。換手機前請先匯出備份。"
      : "這支瀏覽器目前無法儲存照片。請用 Safari 開啟本頁（不要用無痕模式），再試一次。";
    el.style.color = ok ? "" : "var(--danger)";
  }

  function blobToBase64(blob) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var s = String(reader.result || "");
        var i = s.indexOf(",");
        resolve(i >= 0 ? s.slice(i + 1) : s);
      };
      reader.onerror = function () { reject(reader.error); };
      reader.readAsDataURL(blob);
    });
  }

  function base64ToBlob(b64, mime) {
    var bin = atob(b64);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime || "image/jpeg" });
  }

  function formatBytes(n) {
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
    return (n / 1048576).toFixed(1) + " MB";
  }

  function applyTheme(theme) {
    var root = document.documentElement;
    if (!theme || theme === "system") {
      root.removeAttribute("data-theme");
      try { localStorage.setItem(THEME_KEY, "system"); } catch (e) {}
    } else {
      root.setAttribute("data-theme", theme);
      try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    }
    updateThemeButton();
  }

  function currentThemePref() {
    try { return localStorage.getItem(THEME_KEY) || "system"; } catch (e) { return "system"; }
  }

  function isDarkNow() {
    var pref = currentThemePref();
    if (pref === "dark") return true;
    if (pref === "light") return false;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }

  function updateThemeButton() {
    var btn = $("themeBtn");
    if (!btn) return;
    var dark = isDarkNow();
    btn.setAttribute("aria-label", dark ? "切換淺色模式" : "切換深色模式");
    btn.innerHTML = dark
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>';
  }

  function filteredRecords() {
    return records.filter(function (r) {
      if (filter === "all") return true;
      if (filter.indexOf("season:") === 0) {
        var key = filter.slice(7);
        return seasonKey(seasonOf(r.date)) === key;
      }
      if (filter.indexOf("month:") === 0) {
        return monthKey(r.date) === filter.slice(6);
      }
      return true;
    });
  }

  function sortRecords(list) {
    return list.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
  }

  function summarize(list) {
    var full = 0, half = 0, income = 0;
    var boards = { snowboard: { days: 0, income: 0, count: 0 }, ski: { days: 0, income: 0, count: 0 } };
    var resorts = {};
    list.forEach(function (r) {
      var d = daysOf(r);
      if (r.period === "full") full += 1; else half += 1;
      income += r.price;
      boards[r.board].days += d;
      boards[r.board].income += r.price;
      boards[r.board].count += 1;
      if (!resorts[r.resort]) resorts[r.resort] = { days: 0, income: 0, count: 0 };
      resorts[r.resort].days += d;
      resorts[r.resort].income += r.price;
      resorts[r.resort].count += 1;
    });
    return { days: full + half * 0.5, full: full, half: half, income: income, boards: boards, resorts: resorts };
  }

  function usedResorts() {
    var seen = {};
    var extras = [];
    records.forEach(function (r) {
      if (DEFAULT_RESORTS.indexOf(r.resort) === -1 && !seen[r.resort]) {
        seen[r.resort] = true;
        extras.push(r.resort);
      }
    });
    extras.sort(function (a, b) { return a.localeCompare(b, "zh-Hant"); });
    return DEFAULT_RESORTS.concat(extras);
  }

  function usedGuests() {
    var seen = {};
    var names = [];
    records.forEach(function (r) {
      var n = (r.guestName || "").trim();
      if (n && !seen[n]) { seen[n] = true; names.push(n); }
    });
    names.sort(function (a, b) { return a.localeCompare(b, "zh-Hant"); });
    return names;
  }

  function toast(msg) {
    var el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2400);
  }

  function showOverlay(yes) {
    $("overlay").classList.toggle("show", !!yes);
  }

  function closePanels(fromPop) {
    if (viewerOpen) closeViewer(true);
    if (openPanel === "form" && formIsNew && !formSaved && formRecordId) {
      deletePhotosForRecord(formRecordId).catch(function () {});

      var el = $(id);
      if (el) el.classList.remove("show");
    });
    $("confirmDialog").classList.remove("show"); $("overlay").classList.remove("front");
    showOverlay(false);

  function openPanelNamed(name) {
    closePanels(true);
    showOverlay(true);
    if (name === "form") $("formSheet").classList.add("show");
    if (name === "backup") $("backupSheet").classList.add("show");
    if (name === "album") $("albumSheet").classList.add("show");

    else history.replaceState({ skiLog: name }, "");

  }

  function renderFilters() {
    var seasons = {};
    var months = {};
    records.forEach(function (r) {
      var s = seasonOf(r.date);
      seasons[seasonKey(s)] = s;
      months[monthKey(r.date)] = true;
    });
    var seasonList = Object.keys(seasons).sort().reverse();
    var monthList = Object.keys(months).sort().reverse();
    var html = '<button type="button" class="chip" data-filter="all" aria-pressed="' + (filter === "all") + '">全部</button>';
    seasonList.forEach(function (k) {
      var id = "season:" + k;
      html += '<button type="button" class="chip" data-filter="' + esc(id) + '" aria-pressed="' + (filter === id) + '">' + esc(seasonLabel(seasons[k])) + "</button>";
    });
    monthList.forEach(function (k) {
      var id = "month:" + k;
      html += '<button type="button" class="chip" data-filter="' + esc(id) + '" aria-pressed="' + (filter === id) + '">' + esc(monthLabel(k)) + "</button>";
    });
    $("filters").innerHTML = html;
  }

  function renderSummary() {
    var list = filteredRecords();
    var s = summarize(list);
    var snow = s.boards.snowboard;
    var ski = s.boards.ski;
    var boardTotal = snow.days + ski.days;
    var boardHtml = "";
    if (boardTotal) {
      function boardSeg(cls, label, days) {
        if (!days) return "";
        var share = days / boardTotal;
        var text = share >= 0.28 ? (label + " " + formatDays(days) + " 天") : formatDays(days);
        return '<span class="seg ' + cls + '" style="flex:' + days + ' 1 0%" title="' + esc(label + " " + formatDays(days) + " 天") + '">' + esc(text) + "</span>";
      }
      boardHtml =
        '<div class="sum-block">' +
          '<div class="break-title">板類</div>' +
          '<div class="board-bar" role="img" aria-label="' +
            esc((snow.days ? "單板 " + formatDays(snow.days) + " 天" : "") + (snow.days && ski.days ? "，" : "") + (ski.days ? "雙板 " + formatDays(ski.days) + " 天" : "")) +
          '">' +
            boardSeg("snowboard", "單板", snow.days) +
            boardSeg("ski", "雙板", ski.days) +
          "</div>" +
        "</div>";
    }
    var resortKeys = Object.keys(s.resorts).sort(function (a, b) {
      return s.resorts[b].days - s.resorts[a].days || a.localeCompare(b, "zh-Hant");
    });
    var resortHtml = resortKeys.map(function (name) {
      var r = s.resorts[name];
      return '<span class="sum-chip"><span class="n">' + esc(name) + '</span><span class="d">' + formatDays(r.days) + " 天</span></span>";
    }).join("");

    var filtered = list.length !== records.length;
    $("summary").innerHTML =
      '<div class="stat-tiles">' +
        '<div class="stat-tile">' +
          '<div class="label">總天數</div>' +
          '<div class="value">' + formatDays(s.days) + "</div>" +
          '<div class="stat-sub">全天 ' + s.full + " 次 · 半天 " + s.half + " 次</div>" +
        "</div>" +
        '<div class="stat-tile">' +
          '<div class="label">總收入</div>' +
          '<div class="value money">' + formatYen(s.income) + "</div>" +
          '<div class="stat-sub">' + (filtered ? "依目前篩選" : (list.length ? "共 " + list.length + " 筆" : "尚無紀錄")) + "</div>" +
        "</div>" +
      "</div>" +
      boardHtml +
      (resortHtml ? '<div class="sum-block"><div class="break-title">雪場</div><div class="sum-chips">' + resortHtml + "</div></div>" : "");
  }

  function renderList() {
    var list = sortRecords(filteredRecords());
    var el = $("list");
    var empty = $("empty");
    if (!list.length) {
      el.innerHTML = "";
      empty.style.display = "block";
      empty.innerHTML = records.length
        ? "<strong>這個範圍沒有紀錄</strong>試試切換上方的月份或雪季。"
        : "<strong>還沒有紀錄</strong>點右上角＋，記下第一筆教課。";

    });
    el.innerHTML = groups.map(function (g) {
      var sum = summarize(g.items);
      var cards = g.items.map(function (r) {

        var guest = r.guestName ? '<div class="guest-line">' + esc(r.guestName) + "</div>" : "";
        var d = dateParts(r.date);
        return (
          '<article class="card" data-id="' + esc(r.id) + '">' +
            '<div class="card-row">' +
              '<button type="button" class="card-main" data-edit="' + esc(r.id) + '" aria-label="編輯 ' + esc(formatDate(r.date)) + " " + esc(r.resort) + '">' +
                '<div class="card-info">' +
                  '<div class="date-strip">' +
                    '<div class="date-block" aria-label="' + esc(d.label) + '">' +
                      '<span class="d-day">' + esc(d.day) + "</span>" +
                      '<span class="d-week">（' + esc(d.week) + "）</span>" +
                    "</div>" +
                    '<div class="card-chips">' +
                      '<span class="badge badge-period badge-' + r.period + '"><span class="chip-label">' + periodLabel(r.period) + "</span></span>" +
                      '<span class="badge badge-board badge-' + r.board + '"><span class="chip-label">' + boardLabel(r.board) + "</span></span>" +
                    "</div>" +
                  "</div>" +

                    '<div class="price">' + formatYen(r.price) + "</div>" +

                    guest +
                    note +
                  "</div>" +
                "</div>" +
              "</button>" +
              '<button type="button" class="card-cover" data-thumbs-for="' + esc(r.id) + '" data-record="' + esc(r.id) + '" aria-label="查看照片"></button>' +
            "</div>" +
          "</article>"
        );
      }).join("");
      return '<div class="group-h"><span>' + esc(monthLabel(g.key)) + "</span><span class=\"meta\">" + formatDays(sum.days) + " 天 · " + formatYen(sum.income) + "</span></div>" + cards;
    }).join("");
    hydrateThumbs();
  }

  async function hydrateThumbs() {
    var photos;
    try { photos = await allPhotos(); } catch (e) { return; }
    var byRec = {};
    photos.forEach(function (p) {
      (byRec[p.recordId] = byRec[p.recordId] || []).push(p);
    });
    document.querySelectorAll("[data-thumbs-for]").forEach(function (el) {
      var recId = el.getAttribute("data-thumbs-for");
      var list = (byRec[recId] || []).slice().sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
      var card = el.closest(".card");
      if (!list.length) {
        el.innerHTML = "";
        el.removeAttribute("data-photo");
        if (card) card.classList.remove("card--with-photo");
        return;
      }
      var first = list[0];
      var src = photoURL(first, true);
      if (!src) {
        el.innerHTML = "";
        el.removeAttribute("data-photo");
        if (card) card.classList.remove("card--with-photo");
        return;
      }
      if (card) card.classList.add("card--with-photo");
      el.setAttribute("data-photo", first.id);
      el.setAttribute("data-record", recId);
      el.setAttribute("aria-label", list.length > 1 ? ("查看照片，共 " + list.length + " 張") : "查看照片");
      var more = list.length > 1 ? '<span class="cover-more">+' + (list.length - 1) + "</span>" : "";
      el.innerHTML = '<img alt="" src="' + src + '">' + more;
    });
  }

  function render() {
    if (filter !== "all") {
      var exists = false;
      if (filter.indexOf("season:") === 0) {
        exists = records.some(function (r) { return seasonKey(seasonOf(r.date)) === filter.slice(7); });
      } else if (filter.indexOf("month:") === 0) {
        exists = records.some(function (r) { return monthKey(r.date) === filter.slice(6); });
      }
      if (!exists) filter = "all";
    }
    renderFilters();
    renderSummary();
    renderList();
    renderDatalist();
  }

  function renderDatalist() {
    $("resortList").innerHTML = usedResorts().map(function (name) {
      return '<option value="' + esc(name) + '">';
    }).join("");
    if ($("guestList")) {
      $("guestList").innerHTML = usedGuests().map(function (name) {

  function renderResortChips(selected) {
    var html = usedResorts().map(function (name) {
      var on = selected === name;
      return '<button type="button" data-resort="' + esc(name) + '" aria-pressed="' + on + '">' + esc(name) + "</button>";

  async function renderFormPhotos() {
    var box = $("formPhotos");
    if (!box || !formRecordId) return;
    var list;
    try { list = await photosForRecord(formRecordId); } catch (e) { list = []; }
    var html = list.map(function (p) {
      var src = photoURL(p, true);
      return '<div class="photo-cell">' +
        '<button type="button" class="photo-open" data-photo="' + esc(p.id) + '" aria-label="查看照片">' +
          (src ? '<img alt="" src="' + src + '">' : "") + "</button>" +
        '<button type="button" class="del" data-del-photo="' + esc(p.id) + '" aria-label="刪除這張照片">×</button>' +
        "</div>";
    }).join("");
    html += pendingPreviews.map(function (p) {
      return '<div class="photo-cell pending">' +
        '<img alt="處理中" src="' + p.dataUrl + '">' +
        "</div>";
    }).join("");
    box.innerHTML = html;
    var total = list.length + pendingPreviews.length;
    var count = $("photoCount");
    if (count) {
      if (!total) count.textContent = "尚未加入照片";
      else if (pendingPreviews.length) count.textContent = "已有 " + list.length + " 張，正在處理 " + pendingPreviews.length + " 張";
      else count.textContent = "已有 " + list.length + " 張照片";
    }

  function setSeg(name, value) {
    document.querySelectorAll('[data-seg="' + name + '"]').forEach(function (btn) {
      btn.setAttribute("aria-pressed", btn.getAttribute("data-value") === value ? "true" : "false");
    });
  }

  function getSeg(name) {
    var el = document.querySelector('[data-seg="' + name + '"][aria-pressed="true"]');
    return el ? el.getAttribute("data-value") : "";
  }

  function clearFieldErrors() {
    document.querySelectorAll(".field.has-err").forEach(function (f) { f.classList.remove("has-err"); });
  }

  function showFieldError(id, msg) {
    var field = $(id).closest(".field");
    field.classList.add("has-err");
    field.querySelector(".err").textContent = msg;
  }

  function openForm(rec) {
    if (openPanel) closePanels(true);
    clearFieldErrors();
    formSaved = false;
    formIsNew = !rec;
    formRecordId = rec ? rec.id : uid();
    editingId = rec ? rec.id : null;
    pendingPreviews = [];
    $("formTitle").textContent = rec ? "編輯紀錄" : "新增紀錄";
    $("formDate").value = rec ? rec.date : todayISO();
    setSeg("period", rec ? rec.period : "full");
    setSeg("board", rec ? rec.board : "snowboard");
    $("formPrice").value = rec ? String(rec.price) : "";
    $("formResort").value = rec ? rec.resort : "";
    $("formGuest").value = rec && rec.guestName ? rec.guestName : "";
    $("formNote").value = rec ? rec.note : "";
    $("formDelete").style.display = rec ? "block" : "none";
    $("photoProgress").textContent = "";
    renderResortChips(rec ? rec.resort : "");
    $("copyBox").classList.remove("show");
    renderFormPhotos();
    ensurePhotoStorage().then(updatePhotoStorageHint);
    openPanelNamed("form");
    setTimeout(function () { $("formDate").blur(); }, 0);
  }

  function saveForm() {
    clearFieldErrors();
    var date = $("formDate").value;
    var period = getSeg("period");
    var board = getSeg("board");
    var price = parsePrice($("formPrice").value);
    var resort = $("formResort").value.trim();
    var guestName = $("formGuest").value.trim();
    var note = $("formNote").value.trim();
    var ok = true;
    if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) {
      showFieldError("formDate", "請選擇日期");
      ok = false;
    }
    if (period !== "full" && period !== "half") {
      showFieldError("formPeriod", "請選擇時段");
      ok = false;
    }
    if (price === null) {
      showFieldError("formPrice", "請輸入日圓整數，例如 25000");
      ok = false;
    }
    if (!resort) {
      showFieldError("formResort", "請填寫雪場");
      ok = false;
    }
    if (board !== "snowboard" && board !== "ski") {
      showFieldError("formBoard", "請選擇板類");
      ok = false;
    }
    if (!ok) return;

    var now = Date.now();
    if (editingId) {
      var idx = records.findIndex(function (r) { return r.id === editingId; });
      if (idx === -1) {
        toast("找不到這筆紀錄");
        return;
      }
      records[idx] = Object.assign({}, records[idx], {
        date: date, period: period, price: price, resort: resort, board: board,
        guestName: guestName, note: note, updatedAt: now
      });
    } else {
      records.push({
        id: formRecordId, date: date, period: period, price: price, resort: resort, board: board,
        guestName: guestName, note: note, createdAt: now, updatedAt: now
      });
    }
    if (!persist()) return;
    formSaved = true;
    var savedId = formRecordId;
    closePanels();
    invalidatePhotos();
    render();
    toast(editingId ? "已更新" : "已記下一筆");
    setTimeout(function () { hydrateThumbs(); }, 0);
  }

  async function askDelete() {
    if (!editingId) return;
    var rec = records.find(function (r) { return r.id === editingId; });
    var n = 0;
    try { n = (await photosForRecord(editingId)).length; } catch (e) {}
    var text = rec
      ? "確定刪除 " + formatDate(rec.date) + "「" + rec.resort + "」這筆紀錄？刪除後無法復原。"
      : "確定刪除這筆紀錄？刪除後無法復原。";
    if (n) text += "這筆紀錄的 " + n + " 張照片也會一起刪除。";
    $("confirmTitle").textContent = "刪除紀錄";
    $("confirmText").textContent = text;
    $("confirmOk").textContent = "刪除";
    $("confirmOk").className = "btn danger";
    $("confirmDialog").dataset.mode = "delete";
    $("confirmDialog").classList.add("show");
    $("overlay").classList.add("front");
    showOverlay(true);
  }

  async function doDelete() {
    if (!editingId) return;
    var id = editingId;
    try { await deletePhotosForRecord(id); } catch (e) {}
    records = records.filter(function (r) { return r.id !== id; });
    persist();
    formSaved = true;
    formIsNew = false;
    $("confirmDialog").classList.remove("show"); $("overlay").classList.remove("front");
    closePanels();
    render();
    toast("已刪除");
  }

  function askDeletePhoto(photoId) {
    pendingPhotoId = photoId;
    $("confirmTitle").textContent = "刪除照片";
    $("confirmText").textContent = "確定刪除這張照片？刪除後無法復原。";
    $("confirmOk").textContent = "刪除";
    $("confirmOk").className = "btn danger";
    $("confirmAlt").style.display = "none";
    $("confirmDialog").dataset.mode = "delete-photo";
    $("confirmDialog").classList.add("show");
    $("overlay").classList.add("front");
    showOverlay(true);
  }

  async function doDeletePhoto() {
    if (!pendingPhotoId) return;
    var id = pendingPhotoId;
    pendingPhotoId = null;
    try { await deletePhotoById(id); } catch (e) {
      toast("無法刪除照片");
      return;
    }
    $("confirmDialog").classList.remove("show"); $("overlay").classList.remove("front");
    if (viewerOpen) {
      viewerList = viewerList.filter(function (x) { return x !== id; });
      if (!viewerList.length) closeViewer();
      else {
        if (viewerIndex >= viewerList.length) viewerIndex = viewerList.length - 1;
        showViewerImage();
      }
    }
    if (openPanel === "form") {
      showOverlay(true);
      renderFormPhotos();
    } else if (openPanel === "album") {
      showOverlay(true);
      renderAlbum();
    }
    hydrateThumbs();
    toast("已刪除照片");
  }

  async function addFiles(files) {
    files = (files || []).filter(function (f) {
      return f && (!f.type || f.type.indexOf("image/") === 0 || /\.(heic|heif|jpe?g|png|gif|webp|tif)$/i.test(f.name || ""));
    });
    if (!files.length) {
      alert("沒有讀到照片。請再試一次，或改從「照片」相簿選取。");
      return;
    }
    var storageOk = await ensurePhotoStorage();
    if (!storageOk) {
      updatePhotoStorageHint(false);
      alert("這支瀏覽器目前無法儲存照片。請用 Safari 開啟這個網頁（不要用無痕模式），加入主畫面後再試一次。");
      return;
    }
    var existing;
    try { existing = await photosForRecord(formRecordId); } catch (e) {
      updatePhotoStorageHint(false);
      alert("無法存取照片儲存空間，所以照片沒有被存下來。請用 Safari 開啟後再試。");
      return;
    }
    var room = MAX_PHOTOS_PER_RECORD - existing.length - pendingPreviews.length;
    if (room <= 0) {
      alert("每筆最多 " + MAX_PHOTOS_PER_RECORD + " 張照片。");
      return;
    }
    if (files.length > room) {
      files = files.slice(0, room);
      alert("已達上限，只會加入前 " + room + " 張。");
    }
    var ok = 0, fail = 0, failNames = [];
    for (var i = 0; i < files.length; i++) {
      var file = files[i];
      var tempId = "pending-" + uid();
      $("photoProgress").textContent = "正在處理照片 " + (i + 1) + "／" + files.length + "…";
      try {
        var previewUrl = await readFileAsDataURL(file);
        pendingPreviews.push({ id: tempId, dataUrl: previewUrl });
        renderFormPhotos();
        var result = await storeableFromFile(file);
        var photoId = uid();
        await putPhoto({
          id: photoId,
          recordId: formRecordId,
          createdAt: Date.now() + i,
          width: result.width,
          height: result.height,
          mime: result.mime || "image/jpeg",
          dataUrl: result.dataUrl,
          thumbUrl: result.thumbUrl || result.dataUrl
        });
        pendingPreviews = pendingPreviews.filter(function (p) { return p.id !== tempId; });
        ok += 1;
        renderFormPhotos();
      } catch (e) {
        pendingPreviews = pendingPreviews.filter(function (p) { return p.id !== tempId; });
        fail += 1;
        failNames.push(file.name || ("第 " + (i + 1) + " 張"));
        renderFormPhotos();
      }
    }
    $("photoProgress").textContent = "";
    if (ok && !fail) toast("已加入 " + ok + " 張照片");
    else if (ok && fail) alert("已加入 " + ok + " 張照片，但有 " + fail + " 張失敗：" + failNames.join("、") + "。請再試一次，或改用 JPG。");
    else alert("照片無法顯示或儲存。" + (failNames.length ? "（" + failNames.join("、") + "）" : "") + "請再試一次。若還是不行，請在相簿先存成 JPG。");
  }

  function recordById(id) {
    return records.find(function (r) { return r.id === id; });
  }

  function openViewer(ids, index) {
    if (!ids || !ids.length) return;
    viewerList = ids.slice();
    viewerIndex = Math.max(0, Math.min(index || 0, viewerList.length - 1));
    $("viewer").classList.add("show");
    if (!viewerOpen) history.pushState({ skiLogViewer: 1 }, "");
    viewerOpen = true;
    showViewerImage();
  }

  function closeViewer(fromPop) {
    $("viewer").classList.remove("show");
    $("viewerImg").removeAttribute("src");
    var was = viewerOpen;
    viewerOpen = false;
    if (was && !fromPop && history.state && history.state.skiLogViewer) history.back();
  }

  async function showViewerImage() {
    var id = viewerList[viewerIndex];
    var photos;
    try { photos = await allPhotos(); } catch (e) { return; }
    var photo = photos.find(function (p) { return p.id === id; });
    if (!photo) return;
    $("viewerImg").src = photoURL(photo, false);
    var rec = recordById(photo.recordId);
    var meta = [];
    if (rec) {
      meta.push(formatDate(rec.date));
      meta.push(guestLabel(rec.guestName));
      if (rec.resort) meta.push(rec.resort);
    }
    $("viewerMeta").textContent = meta.join(" · ") + (viewerList.length > 1 ? "  " + (viewerIndex + 1) + "/" + viewerList.length : "");
    $("viewerPrev").style.visibility = viewerList.length > 1 ? "visible" : "hidden";
    $("viewerNext").style.visibility = viewerList.length > 1 ? "visible" : "hidden";
  }

  function viewerStep(dir) {
    if (viewerList.length < 2) return;
    viewerIndex = (viewerIndex + dir + viewerList.length) % viewerList.length;
    showViewerImage();
  }

  async function renderAlbum() {
    var box = $("albumBody");
    var photos;
    try { photos = await allPhotos(); } catch (e) {
      box.innerHTML = '<div class="empty"><strong>無法開啟相簿</strong>這支瀏覽器可能封鎖了本機資料庫。</div>';
      return;
    }
    $("albumCount").textContent = photos.length ? ("共 " + photos.length + " 張") : "";
    if (!photos.length) {
      box.innerHTML = '<div class="empty"><strong>還沒有照片</strong>在紀錄裡加入客人照片後，會顯示在這裡。照片只存在這支手機，不會上傳。</div>';
      return;
    }
    var recMap = {};
    records.forEach(function (r) { recMap[r.id] = r; });
    var groups = [];
    var map = {};
    photos.slice().sort(function (a, b) {
      var ra = recMap[a.recordId];
      var rb = recMap[b.recordId];
      var da = ra ? ra.date : "";
      var db = rb ? rb.date : "";
      if (da !== db) return da < db ? 1 : -1;
      var ga = ra ? guestLabel(ra.guestName) : "未填名字";
      var gb = rb ? guestLabel(rb.guestName) : "未填名字";
      if (ga !== gb) return ga.localeCompare(gb, "zh-Hant");
      return (a.createdAt || 0) - (b.createdAt || 0);
    }).forEach(function (p) {
      var rec = recMap[p.recordId];
      var date = rec ? rec.date : "unknown";
      var guest = rec ? guestLabel(rec.guestName) : "未填名字";
      var key = date + "\t" + guest;
      if (!map[key]) {
        map[key] = { date: date, guest: guest, rec: rec, items: [] };
        groups.push(map[key]);
      }
      map[key].items.push(p);
    });
    box.innerHTML = groups.map(function (g) {
      var title = (g.date !== "unknown" ? formatDate(g.date) : "未對應日期") + " · " + g.guest;
      var sub = g.rec && g.rec.resort ? " · " + g.rec.resort : "";
      var grid = g.items.map(function (p) {
        return '<button type="button" class="album-thumb" data-photo="' + esc(p.id) + '" data-record="' + esc(p.recordId) + '" aria-label="查看照片"><img alt="" src="' + photoURL(p, true) + '"></button>';
      }).join("");
      return '<section class="album-section"><h3>' + esc(title) + "<span>" + esc(sub) + "</span></h3><div class=\"album-grid\">" + grid + "</div></section>";
    }).join("");
  }

  async function photoToBase64(p) {
    var url = p.dataUrl || (typeof p.blob === "string" ? p.blob : "");
    if (url && url.indexOf("data:") === 0) {
      var i = url.indexOf(",");
      return i >= 0 ? url.slice(i + 1) : url;
    }
    var blob = p.blob;
    if (blob && typeof Blob !== "undefined" && blob instanceof Blob) return blobToBase64(blob);
    throw new Error("no photo data");
  }

  async function exportFullBackup() {
    toast("正在準備備份…");
    var photos = [];
    try { photos = await allPhotos(); } catch (e) { photos = []; }
    var encoded = [];
    for (var i = 0; i < photos.length; i++) {
      var p = photos[i];
      encoded.push({
        id: p.id,
        recordId: p.recordId,
        createdAt: p.createdAt,
        width: p.width,
        height: p.height,
        mime: p.mime || "image/jpeg",
        data: await photoToBase64(p)
      });
    }
    var payload = {
      app: "ski-work-log",
      version: 2,
      exportedAt: new Date().toISOString(),
      records: records,
      photos: encoded
    };
    var json = JSON.stringify(payload);
    var size = formatBytes(new Blob([json]).size);
    await shareOrDownload("ski-log-" + filenameStamp() + ".json", json, "application/json");
    toast("備份約 " + size + "，含 " + records.length + " 筆紀錄、" + encoded.length + " 張照片");
  }

  function toCSV(list) {
    var header = ["日期", "時段", "價錢", "雪場", "板類", "客人名字", "備註"];
    function cell(v) {
      var s = String(v == null ? "" : v);
      if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }
    var lines = [header.join(",")];
    sortRecords(list).slice().reverse().forEach(function (r) {
      lines.push([r.date, periodLabel(r.period), r.price, r.resort, boardLabel(r.board), r.guestName || "", r.note].map(cell).join(","));
    });
    return "\uFEFF" + lines.join("\r\n");
  }

  function filenameStamp() {
    var d = new Date();
    function z(n) { return String(n).padStart(2, "0"); }
    return d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate());
  }

  async function shareOrDownload(filename, content, mime) {
    var blob = new Blob([content], { type: mime });
    var file;
    try { file = new File([blob], filename, { type: mime }); } catch (e) { file = null; }
    if (file && navigator.canShare) {
      try {
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: filename });
          toast("已開啟分享");
          return;
        }
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
    }
    try {
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      toast("已開始下載");
      return;
    } catch (e) {}
    if (typeof content === "string" && content.length > 200000) {
      toast("檔案太大，無法複製，請改用可下載的瀏覽器再試");
      return;
    }
    $("copyBox").classList.add("show");
    $("copyArea").value = String(content).replace(/^\uFEFF/, "");
    $("copyArea").focus();
    $("copyArea").select();
    toast("無法直接下載，請複製下方內容自行存檔");
  }

  async function importJSONText(text, mode) {
    var data;
    try { data = JSON.parse(text); } catch (e) {
      toast("這個檔案不是有效的 JSON");
      return;
    }
    var incoming = [];
    if (Array.isArray(data)) incoming = data;
    else if (data && Array.isArray(data.records)) incoming = data.records;
    else {
      toast("找不到紀錄資料");
      return;
    }
    var valid = incoming.filter(isValidRecord).map(normalizeRecord);
    var skipped = incoming.length - valid.length;
    var incomingPhotos = (data && Array.isArray(data.photos)) ? data.photos : [];
    if (!valid.length && !incomingPhotos.length) {
      toast("沒有可匯入的紀錄");
      return;
    }
    if (mode === "replace") {
      records = valid;
      try { await clearAllPhotos(); } catch (e) {}
    } else {
      var byId = {};
      records.forEach(function (r) { byId[r.id] = r; });
      valid.forEach(function (r) { byId[r.id] = r; });
      records = Object.keys(byId).map(function (k) { return byId[k]; });
    }
    if (!persist()) return;
    var photoOk = 0, photoFail = 0;
    for (var i = 0; i < incomingPhotos.length; i++) {
      var p = incomingPhotos[i];
      try {
        if (!p || !p.data || !p.recordId) { photoFail += 1; continue; }
        var dataUrl = String(p.data).indexOf("data:") === 0 ? String(p.data) : ("data:" + (p.mime || "image/jpeg") + ";base64," + p.data);
        var thumbUrl = dataUrl;
        var width = p.width || 0;
        var height = p.height || 0;
        var mime = p.mime || "image/jpeg";
        try {
          var result = await compressImage(dataUrl);
          thumbUrl = result.thumbUrl || dataUrl;
          dataUrl = result.dataUrl || dataUrl;
          mime = result.mime || mime;
          if (!width) width = result.width;
          if (!height) height = result.height;
        } catch (e) {}
        await putPhoto({
          id: p.id || uid(),
          recordId: p.recordId,
          createdAt: p.createdAt || Date.now(),
          width: width,
          height: height,
          mime: mime,
          dataUrl: dataUrl,
          thumbUrl: thumbUrl
        });
        photoOk += 1;
      } catch (e) {
        photoFail += 1;
      }
    }
    closePanels();
    render();
    var msg = "已匯入 " + valid.length + " 筆紀錄";
    if (photoOk) msg += "、" + photoOk + " 張照片";
    if (skipped) msg += "，略過 " + skipped + " 筆格式不符";
    if (photoFail) msg += "，" + photoFail + " 張照片失敗";
    toast(msg);
  }

  async function askImport(text) {
    pendingImportText = text;
    var data = null;
    try { data = JSON.parse(text); } catch (e) {
      toast("這個檔案不是有效的 JSON");
      return;
    }
    var nRec = data && Array.isArray(data.records) ? data.records.length : (Array.isArray(data) ? data.length : 0);
    var nPhoto = data && Array.isArray(data.photos) ? data.photos.length : 0;
    var existingPhotos = 0;
    try { existingPhotos = (await allPhotos()).length; } catch (e) {}
    var textMsg = "這個備份有 " + nRec + " 筆紀錄" + (nPhoto ? "和 " + nPhoto + " 張照片" : "（沒有照片）") + "。要合併到現有資料，還是用這個檔案取代全部？";
    if (nPhoto === 0 && existingPhotos && !Array.isArray(data)) {
      textMsg += "取代全部會清除目前的照片。";
    }
    $("confirmTitle").textContent = "匯入備份";
    $("confirmText").textContent = textMsg;
    $("confirmOk").textContent = "合併";
    $("confirmOk").className = "btn primary";
    $("confirmAlt").style.display = "block";
    $("confirmDialog").dataset.mode = "import";
    $("confirmDialog").classList.add("show");
    $("overlay").classList.add("front");
    showOverlay(true);
  }

  function onReady() {
    applyTheme(currentThemePref());
    if (window.matchMedia) {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", updateThemeButton);
    }
    loadRecords();
    render();
    ensurePhotoStorage().then(function (ok) {
      updatePhotoStorageHint(ok);
      if (!ok) toast("目前無法儲存照片，請用 Safari 開啟");
    }).catch(function () { updatePhotoStorageHint(false); });

    $("addBtn").addEventListener("click", function () { openForm(null); });
    $("backupBtn").addEventListener("click", function () {
      $("copyBox").classList.remove("show");
      openPanelNamed("backup");
    });
    $("albumBtn").addEventListener("click", function () {
      openPanelNamed("album");
      renderAlbum();
    });
    $("themeBtn").addEventListener("click", function () {
      applyTheme(isDarkNow() ? "light" : "dark");
    });
    $("overlay").addEventListener("click", function () {
      $("confirmDialog").classList.remove("show"); $("overlay").classList.remove("front");
      closePanels();
    });
    $("formCancel").addEventListener("click", function () { closePanels(); });
    $("backupClose").addEventListener("click", function () { closePanels(); });
    $("albumClose").addEventListener("click", function () { closePanels(); });
    $("recordForm").addEventListener("submit", function (e) { e.preventDefault(); saveForm(); });
    $("formDelete").addEventListener("click", function () { askDelete(); });

    $("filters").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-filter]");
      if (!btn) return;
      filter = btn.getAttribute("data-filter");
      render();
    });

    $("list").addEventListener("click", function (e) {
      var thumb = e.target.closest("[data-photo]");
      if (thumb) {
        e.preventDefault();
        var recId = thumb.getAttribute("data-record");
        photosForRecord(recId).then(function (list) {
          var ids = list.map(function (p) { return p.id; });
          openViewer(ids, ids.indexOf(thumb.getAttribute("data-photo")));
        });
        return;
      }
      var edit = e.target.closest("[data-edit]");
      if (!edit) return;
      var rec = records.find(function (r) { return r.id === edit.getAttribute("data-edit"); });
      if (rec) openForm(rec);
    });

    $("formPeriod").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-seg=period]");
      if (!btn) return;
      setSeg("period", btn.getAttribute("data-value"));
    });
    $("formBoard").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-seg=board]");
      if (!btn) return;
      setSeg("board", btn.getAttribute("data-value"));
    });

    $("resortChips").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-resort]");
      if (!btn) return;
      $("formResort").value = btn.getAttribute("data-resort");
      renderResortChips($("formResort").value);
    });
    $("formResort").addEventListener("input", function () {
      renderResortChips($("formResort").value.trim());
    });

    $("addPhotosBtn").addEventListener("click", function () { $("photoInput").click(); });
    $("photoInput").addEventListener("change", function (e) {
      var list = e.target.files;
      var files = [];
      if (list && list.length) {
        for (var i = 0; i < list.length; i++) files.push(list[i]);
      }
      e.target.value = "";
      addFiles(files);
    });
    $("formPhotos").addEventListener("click", function (e) {
      var del = e.target.closest("[data-del-photo]");
      if (del) {
        askDeletePhoto(del.getAttribute("data-del-photo"));
        return;
      }
      var open = e.target.closest("[data-photo]");
      if (open) {
        photosForRecord(formRecordId).then(function (list) {
          var ids = list.map(function (p) { return p.id; });
          openViewer(ids, ids.indexOf(open.getAttribute("data-photo")));
        });
      }
    });

    $("albumBody").addEventListener("click", function (e) {
      var thumb = e.target.closest("[data-photo]");
      if (!thumb) return;
      var recId = thumb.getAttribute("data-record");
      photosForRecord(recId).then(function (list) {
        var ids = list.map(function (p) { return p.id; });
        openViewer(ids, ids.indexOf(thumb.getAttribute("data-photo")));
      });
    });

    $("viewerClose").addEventListener("click", function () { closeViewer(); });
    $("viewerPrev").addEventListener("click", function () { viewerStep(-1); });
    $("viewerNext").addEventListener("click", function () { viewerStep(1); });
    $("viewerDelete").addEventListener("click", function () {
      if (viewerList[viewerIndex]) askDeletePhoto(viewerList[viewerIndex]);
    });
    $("viewerStage").addEventListener("touchstart", function (e) {
      if (e.changedTouches && e.changedTouches[0]) viewerTouchX = e.changedTouches[0].clientX;
    }, { passive: true });
    $("viewerStage").addEventListener("touchend", function (e) {
      if (!e.changedTouches || !e.changedTouches[0]) return;
      var dx = e.changedTouches[0].clientX - viewerTouchX;
      if (dx > 50) viewerStep(-1);
      else if (dx < -50) viewerStep(1);
    }, { passive: true });
    document.addEventListener("keydown", function (e) {
      if (!viewerOpen) return;
      if (e.key === "Escape") closeViewer();
      if (e.key === "ArrowLeft") viewerStep(-1);
      if (e.key === "ArrowRight") viewerStep(1);
    });

    $("exportJson").addEventListener("click", function () { exportFullBackup(); });
    $("exportCsv").addEventListener("click", function () {
      shareOrDownload("ski-log-" + filenameStamp() + ".csv", toCSV(records), "text/csv;charset=utf-8");
    });
    $("importBtn").addEventListener("click", function () { $("fileInput").click(); });
    $("fileInput").addEventListener("change", function (e) {
      var file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!file) return;
      toast("正在讀取備份…");
      var reader = new FileReader();
      reader.onload = function () { askImport(String(reader.result || "")); };
      reader.onerror = function () { toast("讀取檔案失敗"); };
      reader.readAsText(file, "utf-8");
    });
    $("copyNow").addEventListener("click", function () {
      var text = $("copyArea").value;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast("已複製"); }).catch(function () { fallbackCopy(text); });
      } else fallbackCopy(text);
    });

    $("confirmCancel").addEventListener("click", function () {
      $("confirmDialog").classList.remove("show"); $("overlay").classList.remove("front");
      pendingPhotoId = null;
      if (viewerOpen) { /* keep viewer */ }
      else if (openPanel) showOverlay(true);
      else closePanels();
      $("confirmAlt").style.display = "none";
    });
    $("confirmOk").addEventListener("click", function () {
      var mode = $("confirmDialog").dataset.mode;
      $("confirmAlt").style.display = "none";
      $("confirmDialog").classList.remove("show"); $("overlay").classList.remove("front");
      if (mode === "delete") doDelete();
      else if (mode === "delete-photo") doDeletePhoto();
      else if (mode === "import") importJSONText(pendingImportText, "merge");
    });
    $("confirmAlt").addEventListener("click", function () {
      $("confirmAlt").style.display = "none";
      $("confirmDialog").classList.remove("show"); $("overlay").classList.remove("front");
      importJSONText(pendingImportText, "replace");
    });

    window.addEventListener("popstate", function () {
      $("confirmDialog").classList.remove("show"); $("overlay").classList.remove("front");
      $("confirmAlt").style.display = "none";
      if (viewerOpen) {
        closeViewer(true);
        return;
      }
      if (openPanel) closePanels(true);
    });
  }

  function fallbackCopy(text) {
    $("copyArea").value = text;
    $("copyArea").select();
    try {
      document.execCommand("copy");
      toast("已複製");
    } catch (e) {
      toast("請手動複製");
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", onReady);
  else onReady();
})();

  
  </script>
</body>
</html>
